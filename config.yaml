# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: blockbet-indexer
description: BLOCKBET indexer on Arc Testnet
disable_default_cross_chain: true
contracts:
  - name: BlockBet
    events:
      - event: "MatchCreated(uint256 matchId, string homeTeam, string awayTeam)"
      - event: "BetPlaced(uint256 matchId, address bettor, uint8 prediction, uint256 amount, uint256 oddsBps)"
      - event: "BetCashedOut(uint256 matchId, address bettor, uint256 amount)"
      - event: "MatchResolved(uint256 matchId, uint8 result)"
      - event: "WinningsClaimed(uint256 matchId, address bettor, uint256 amount)"
      - event: "AccumulatorPlaced(uint256 accId, address bettor, uint256 legCount, uint256 stake, uint256 combinedOddsBps)"
      - event: "AccumulatorClaimed(uint256 accId, address bettor, uint256 amount)"
      - event: "RouletteBetPlaced(uint256 betId, address bettor, uint256 amount, uint256 numberCount)"
      - event: "RouletteSettled(uint256 betId, address bettor, uint256 winningNumber, uint256 payout)"
      - event: "AviatorBetPlaced(uint256 betId, address bettor, uint256 amount)"
      - event: "AviatorSettled(uint256 betId, address bettor, uint256 payout)"
  - name: BlockSwap
    events:
      - event: "Swap(address indexed token, address indexed trader, bool usdcIn, uint256 amountIn, uint256 amountOut)"
      - event: "LiquidityAdded(address indexed token, address indexed provider, uint256 usdcAmount, uint256 tokenAmount, uint256 lpMinted)"
      - event: "LiquidityRemoved(address indexed token, address indexed provider, uint256 usdcAmount, uint256 tokenAmount, uint256 lpBurned)"
chains:
  - id: 5042002
    rpc: https://rpc.testnet.arc.io
    start_block: 0
    contracts:
      - name: BlockBet
        address: "0xd8F53e3841669dB8Aa4b9a991e78AdE42Ae79D29"
      - name: BlockSwap
        address: "0x62a1A511213f9D39beec755B0817Dacc7D9e2cAe"
