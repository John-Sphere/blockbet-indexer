type Match {
  id: ID!
  matchId: BigInt!
  homeTeam: String!
  awayTeam: String!
  totalHome: BigInt!
  totalDraw: BigInt!
  totalAway: BigInt!
  resolved: Boolean!
  result: BigInt!
}

type Bet {
  id: ID!
  matchId: BigInt!
  bettor: String!
  prediction: BigInt!
  amount: BigInt!
  oddsBps: BigInt!
  claimed: Boolean!
  cashedOut: Boolean!
}

type Accumulator {
  id: ID!
  accId: BigInt!
  bettor: String!
  legCount: BigInt!
  stake: BigInt!
  combinedOddsBps: BigInt!
  claimed: Boolean!
}

type RouletteBet {
  id: ID!
  betId: BigInt!
  bettor: String!
  amount: BigInt!
  numberCount: BigInt!
  settled: Boolean!
  winningNumber: BigInt
  payout: BigInt
}

type AviatorBet {
  id: ID!
  betId: BigInt!
  bettor: String!
  amount: BigInt!
  settled: Boolean!
  payout: BigInt
}

type SwapEvent {
  id: ID!
  token: String!
  trader: String!
  usdcIn: Boolean!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type MailMessage {
  id: ID!
  from: String!
  to: String!
  ciphertext: Bytes!
  nonce: Bytes!
  timestamp: BigInt!
  paymentToken: String
  paymentAmount: BigInt
}

type PublicKeyRegistration {
  id: ID!
  publicKey: Bytes!
}
